<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Scopa Napoletana app icon</title>
  <desc>Vintage-inspired Neapolitan playing card emblem in olive, ivory, muted gold, brick red and forest green.</desc>
  <defs>
    <style>
      .ink{stroke:#292b18;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .fine{stroke:#292b18;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .goldline{stroke:#b78b36;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .ivory{fill:#f1e2bd}
      .gold{fill:#d2a33f}
      .darkgold{fill:#a87928}
      .green{fill:#344b32}
      .red{fill:#a94d35}
      .blue{fill:#46605a}
      .olive{fill:#303719}
    </style>
  </defs>

  <!-- Solid field -->
  <rect width="1024" height="1024" fill="#303719"/>

  <!-- Rear cards -->
  <g class="ink">
