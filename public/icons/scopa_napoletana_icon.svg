      <path d="M516 626 Q500 612 507 599 Q519 603 521 614 Q525 601 536 599 Q541 614 525 626 L521 642 Z"/>
      <path d="M565 672 Q549 658 556 645 Q568 649 570 660 Q574 647 585 645 Q590 660 574 672 L570 688 Z"/>
      <path d="M533 721 Q517 707 524 694 Q536 698 538 709 Q542 696 553 694 Q558 709 542 721 L538 737 Z"/>
    </g>

    <!-- Face and hair -->
    <path d="M470 329 Q476 267 536 261 Q589 276 584 353 Q580 412 535 448 Q487 432 470 382 Z" fill="#d7b17a"/>
    <path d="M469 337 Q462 285 509 258 Q557 238 583 284 Q558 271 540 286 Q521 307 513 345 Q502 391 480 412 Q462 384 469 337 Z" fill="#75472d"/>
    <path d="M473 337 Q451 367 474 408 Q491 429 511 440 L530 458 Q482 446 456 413 Q442 378 458 347 Z" fill="#75472d"/>
