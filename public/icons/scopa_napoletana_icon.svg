      <rect x="100" y="286" width="270" height="500" rx="34" class="ivory"/>
      <rect x="116" y="302" width="238" height="468" rx="25" fill="none" stroke="#c69a42" stroke-width="8"/>
      <!-- sword -->
      <path d="M235 390 L253 615 L218 684 L200 615 Z" class="blue"/>
      <path d="M235 390 L235 620" class="goldline"/>
      <path d="M170 466 Q235 442 300 466 L284 487 Q235 472 186 487 Z" class="gold"/>
      <path d="M225 615 L235 681 L245 615" class="fine" fill="none"/>
      <circle cx="235" cy="391" r="15" class="gold"/>
    </g>
    <g transform="rotate(-11 350 490)">
      <rect x="216" y="218" width="270" height="570" rx="34" class="ivory"/>
      <rect x="232" y="234" width="238" height="538" rx="25" fill="none" stroke="#c69a42" stroke-width="8"/>
      <!-- cup -->
      <path d="M282 374 Q351 393 420 374 L405 492 Q392 528 351 535 Q310 528 297 492 Z" class="red"/>
      <path d="M282 374 Q351 397 420 374 L412 398 Q351 419 290 398 Z" class="gold"/>
      <path d="M307 419 Q351 440 395 419 L386 479 Q351 502 316 479 Z" fill="#344b32" stroke="#292b18" stroke-width="5"/>
      <path d="M351 535 L351 587 M322 590 Q351 575 380 590 L390 612 Q351 630 312 612 Z" class="gold"/>
      <path d="M302 612 Q351 629 400 612 L414 638 Q351 660 288 638 Z" class="red"/>
      <path d="M320 448 Q351 427 382 448 M319 473 Q351 494 383 473" class="goldline"/>
      <path d="M351 545 L351 575" class="goldline"/>
