      <rect x="554" y="234" width="238" height="538" rx="25" fill="none" stroke="#c69a42" stroke-width="8"/>
      <!-- sun coin -->
      <circle cx="673" cy="478" r="112" class="gold"/>
      <circle cx="673" cy="478" r="94" fill="none" stroke="#292b18" stroke-width="7"/>
      <g class="fine" fill="none">
        <path d="M673 344 L673 370 M673 586 L673 612 M539 478 L565 478 M781 478 L807 478
                 M578 383 L596 401 M750 555 L768 573 M578 573 L596 555 M750 401 L768 383
                 M620 354 L630 380 M716 576 L726 602 M549 425 L575 435 M771 521 L797 531
                 M549 531 L575 521 M771 435 L797 425 M620 602 L630 576 M716 380 L726 354"/>
      </g>
      <circle cx="673" cy="478" r="57" fill="#d9ad4c" stroke="#292b18" stroke-width="6"/>
      <path d="M649 465 Q659 454 667 466 M679 466 Q688 454 698 465" class="fine" fill="none"/>
      <path d="M673 471 L665 491 L680 491" class="fine" fill="none"/>
      <path d="M650 507 Q673 522 696 507" class="fine" fill="none"/>
    </g>
    <g transform="rotate(23 786 520)">
