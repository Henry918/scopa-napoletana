    <path d="M471 372 L450 384 L472 391" fill="#d7b17a" stroke="#292b18" stroke-width="5"/>
    <path d="M482 399 Q497 409 511 399" class="fine" fill="none"/>
    <circle cx="485" cy="360" r="4" fill="#292b18"/>

