    </g>

    <!-- Collar, medallion and belt -->
    <path d="M461 475 Q509 503 568 474 L586 499 Q519 533 445 498 Z" class="gold"/>
    <circle cx="522" cy="493" r="22" class="gold"/>
    <circle cx="522" cy="493" r="11" fill="#ead8ad" stroke="#292b18" stroke-width="4"/>
    <path d="M475 672 Q532 685 594 667 L598 691 Q531 710 472 696 Z" class="gold"/>
    <path d="M478 680 L588 678" class="fine" fill="none"/>

    <!-- Hand gripping staff -->
    <path d="M574 520 Q594 506 610 520 L621 555 Q618 574 601 578 L579 565 Q566 548 574 520 Z" fill="#d7b17a"/>
    <path d="M581 532 Q597 542 610 536 M580 548 Q597 559 615 550" class="fine" fill="none"/>
  </g>

  <!-- Restrained ornamental flourish -->
  <g fill="none" stroke="#c99b3e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 852 C475 815 438 816 407 839 C373 864 349 854 337 832 C330 865 354 890 391 887 C420 884 445 868 468 887 C484 900 495 921 512 941"/>
    <path d="M512 852 C549 815 586 816 617 839 C651 864 675 854 687 832 C694 865 670 890 633 887 C604 884 579 868 556 887 C540 900 529 921 512 941"/>
    <path d="M512 846 C493 823 493 797 512 775 C531 797 531 823 512 846 Z"/>
    <path d="M512 941 C493 913 466 905 444 914 M512 941 C531 913 558 905 580 914"/>
  </g>
  <g fill="#c99b3e">
    <path d="M512 784 C496 803 498 824 512 839 C526 824 528 803 512 784 Z"/>
    <path d="M340 833 C319 828 303 840 305 859 C322 860 336 850 340 833 Z"/>
    <path d="M684 833 C705 828 721 840 719 859 C702 860 688 850 684 833 Z"/>
  </g>
</svg>